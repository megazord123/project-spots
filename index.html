<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="" />
    <meta name="author" content="" />
    <meta name="keywords" content="html, css" />

    <link rel="stylesheet" href="./pages/index.css" />

    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />

    <title>Spots</title>
  </head>

  <body class="page">
    <div class="page__content">
      <header class="header">
        <img src="./images/Logo.svg" alt="Spots logo" class="header__logo" />
      </header>

      <main class="content">
        <section class="profile page__section">
          <img
            src="./images/avatar.jpg"
            alt="Bessie Coleman"
            class="profile__avatar"
          />

          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>

            <p class="profile__description">Civil Aviator</p>

            <button class="profile__edit-btn" type="button">
              <img src="./images/Pencil.svg" alt="" />

              Edit Profile
            </button>
          </div>

          <button class="profile__add-btn" type="button">
            <img src="./images/Plus.svg" alt="" />

            New Post
          </button>
        </section>

        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-button" type="button"></button>
                <img class="card__image" src="#" alt="" />
                <div class="card__footer">
                  <h2 class="card__title"></h2>
                  <button
                    aria-lable="like card"
                    class="card__like-button"
                    type="button"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>

      <footer class="footer page__section">
        <p class="footer__title">2026 © Spots</p>
      </footer>
    </div>

    <div class="modal" id="profile-edit-modal">
      <div class="modal__content">
        <button
          class="modal__close"
          type="button"
          aria-label="Close modal"
        ></button>

        <h2 class="modal__title">Edit profile</h2>

        <form class="modal__form" id="edit-profile-form">
          <label class="modal__label" for="profile-name-input">
            Name

            <input
              id="profile-name-input"
              class="modal__input"
              type="text"
              placeholder="Type your name"
              required
            />
          </label>

          <label class="modal__label" for="profile-description-input">
            Description

            <input
              id="profile-description-input"
              class="modal__input"
              type="text"
              placeholder="Describe yourself"
              required
            />
          </label>

          <button class="modal__submit-btn" type="submit">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="add-card-modal">
      <div class="modal__content">
        <button
          class="modal__close"
          type="button"
          aria-label="Close modal"
        ></button>

        <h2 class="modal__title">New post</h2>

        <form class="modal__form" id="add-card-form">
          <label class="modal__label" for="card-link-input">
            Image link

            <input
              id="card-link-input"
              class="modal__input"
              type="url"
              placeholder="Paste a link to the picture"
              required
            />
          </label>

          <label class="modal__label" for="card-caption-input">
            Caption

            <input
              id="card-caption-input"
              class="modal__input"
              type="text"
              placeholder="Type your caption"
              required
            />
          </label>

          <button class="modal__submit-btn" type="submit">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="modal_type_preview">
      <div class="modal__image-container">
        <button
          class="modal__close-btn"
          type="button"
          aria-label="Close preview"
        ></button>

        <img class="modal__image" src="" alt="" />

        <p class="modal__caption"></p>
      </div>
    </div>

    <script src="./scripts/index.js"></script>
  </body>
</html>
